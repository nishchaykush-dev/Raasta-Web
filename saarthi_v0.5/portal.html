*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Hind,system-ui,sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
.demo{background:var(--warn);color:#000;text-align:center;font-weight:700;font-size:13px;padding:3px 8px}

.nl{background:none;border:0;padding:9px 8px;color:var(--pri);font-size:13px;font-weight:600}
.rel,.rel2{position:relative}
.dd,.sub{display:none;position:absolute;z-index:30;min-width:220px;background:var(--card);border:2px solid var(--line);box-shadow:0 6px 18px #0004}

.dd button,.sub button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:9px 12px;font-size:13px}
.grp::after{content:" ▸"}
.dd button:hover,.sub button:hover{background:var(--acc)}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:10px 0}

.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-weight:600;color:var(--pri);text-align:left}
.bc{font-size:13px;color:var(--mut)}.bc button{background:none;border:0;color:var(--pri);padding:2px}
.lay{display:grid;grid-template-columns:230px 1fr;gap:12px}
@media (max-width:700px){.lay{grid-template-columns:1fr}}
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;align-self:start}
aside button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:6px;font-size:14px}
aside button.in{padding-left:22px;font-size:13px}aside button.on{background:var(--acc);font-weight:700}
.ls{padding-left:0;list-style:none}.ls li{padding:8px 0;border-bottom:1px solid var(--line)}.ls button{background:none;border:0;color:var(--pri);font-weight:600;font-size:16px;padding:0;text-align:left}
.mut{color:var(--mut)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;margin:8px 0}td,th{border-bottom:1px solid var(--line);padding:7px;text-align:left;font-size:14px}th{background:var(--acc)}
label{display:block;font-weight:600;margin-top:10px}
.f{font:inherit;width:100%;padding:10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);margin:4px 0}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:6px;padding:10px 16px;margin:8px 6px 4px 0}
.btn.alt{background:var(--card);color:var(--pri);border:1px solid var(--pri)}.btn.red{background:var(--bad);color:#fff}
.ok{background:var(--acc);border-left:6px solid var(--ok);padding:10px 12px;border-radius:6px;margin-top:10px}
.err{color:var(--bad);font-weight:600;margin-top:8px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm{font-size:15px}.tm b{font-size:22px;font-variant-numeric:tabular-nums}.tm.low b{color:var(--bad)}
.pr{text-align:center;padding:30px 16px}.spin{width:96px;height:96px;margin:10px auto;display:block}
.rot{transform-box:view-box;transform-origin:center;animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rot{animation:none}}
footer{max-width:980px;margin:0 auto;padding:10px 16px 30px;font-size:13px;color:var(--mut)}
</style>
</head>

function act(a,el){
 if(a==='search'){R={v:'search',q:$('q').value.trim()};show()}
 else if(a==='note')$('nt').innerHTML='<div class="ok">'+el.dataset.m+'</div>';
 else if(a==='quick'){R={v:'tx',tx:'number'};show()}
 else if(a==='num'){var v=$('acct').value.replace(/\D/g,'');acct=v;if(v.length<10)msg('Please enter all 10 digits.',1);else{R={v:'tx',tx:'confirm'};show()}}
 else if(a==='pay'){R={v:'tx',tx:'card'};show()}
 else if(a==='card'){var cn=$('cardNo').value.replace(/\D/g,''),nm=$('cardName').value.trim(),ex=$('cardExp').value.trim(),cv=$('cardCvv').value.replace(/\D/g,''),m=/^(\d{2})\/(\d{2})$/.exec(ex);
  if(cn.length!==16)return msg('Please enter all 16 digits of the card number.',1);

  if(!m||+m[1]<1||+m[1]>12)return msg('Enter the expiry date as MM/YY, for example 08/28.',1);
  var nw=new Date();if(+m[2]<nw.getFullYear()%100||(+m[2]===nw.getFullYear()%100&&+m[1]<nw.getMonth()+1))return msg('This card has expired. Please use another card.',1);
  if(cv.length<3)return msg('Please enter the 3-digit CVV.',1);
  $('cardNo').value='';$('cardCvv').value='';otpEnd=Date.now()+300000;R={v:'tx',tx:'otp'};show()}
 else if(a==='verify'){if(Date.now()>otpEnd)return msg('The OTP has expired. Press Resend OTP to get a new one.',1);if($('otpIn').value.replace(/\D/g,'').length!==6)return msg('Please enter the 6-digit OTP.',1);R={v:'tx',tx:'proc'};show()}
 else if(a==='resend'){otpEnd=Date.now()+300000;show()}
 else if(a==='calc'){var u=Math.max(0,+$('u').value||0),b=slabs(u);msg('<table><tr><th>Units</th><th>Rate</th><th>Amount</th></tr>'+b.rows.map(function(r){return '<tr><td>'+r[0]+'</td><td>₹'+r[1]+'</td><td>'+inr(r[2])+'</td></tr>'}).join('')+'<tr><td colspan="2"><b>Total energy charge</b></td><td><b>'+inr(b.t)+'</b></td></tr></table>')}
 else if(a==='fs'){var k=el.dataset.k,f=F[k],vals=f.f.map(function(x,i){return $('f'+i).value.trim()});
  if(vals.some(function(x){return !x}))return msg('Please fill in every field.',1);
  if(k==='view'){var d=vals[0].replace(/\D/g,'');if(d.length!==10)return msg('Please enter all 10 digits.',1);return msg(billHTML(d))}
  if(f.s)return msg(esc(f.s.replace('{0}',vals[0])));
  msg('✔ Submitted. Your reference number is <b>'+f.r+'-'+String(Math.floor(100000+Math.random()*899999))+'</b>. Please keep it safe.')}}
