# Saarthi proxy: Cloudflare Worker settings.
# The Gemini key is NOT here. Store it as a secret:
#     npx wrangler secret put GEMINI_API_KEY
name = "saarthi-proxy"
main = "worker.js"
compatibility_date = "2025-10-01"
workers_dev = true

[vars]
# Free Gemini model. Change here (or in the dashboard) to try another one.
GEMINI_MODEL = "gemini-3-flash-preview"
# Requests allowed per minute from one IP address (approximate, per instance).
RATE_PER_MIN = "30"
# Who may call. Empty = anybody (OK while testing). After your extension has a
# fixed ID, set it, for example:
#   ALLOWED_ORIGINS = "chrome-extension://engcdeaeiihjajiojebijegbdokbfjai"
ALLOWED_ORIGINS = ""

# OPTIONAL stronger rate limit shared across Cloudflare servers.
# Remove the leading "#" on the next 5 lines to turn it on.
# [[unsafe.bindings]]
# name = "RATE_LIMITER"
# type = "ratelimit"
# namespace_id = "1001"
# simple = { limit = 30, period = 60 }
